<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OdontoPrime</title>
  <link rel="stylesheet" href="CSS/style.css">

</head>
<body>

  <header>
    <a href="index.html" class="logo">🦷 AniOdonto<span>Prime</span></a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="produto.html">Tratamentos</a></li>
        <li><a href="new.html">Cadastro</a></li>
        <li><a href="login.html" class="ativo">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-box">
      <h2>Acesso ao Sistema</h2>
      
      <form action="produto.html" method="get">
        <div class="campo">
          <label for="email">E-mail cadastrado</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <div class="form-acoes">
          <button type="submit" class="btn">Entrar</button>
          <a href="new.html" class="btn btn-secundario">Criar nova conta</a>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Ani Odonto Prime Clínica Odontológica - Todos os direitos reservados.</p>
  </footer>

</body>
</html>

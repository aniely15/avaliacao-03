<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Cadastro - Ani Odonto</title>
  <link rel="stylesheet" href="CSS/style.css">

</head>
<body>

  <header>
    <a href="index.html" class="logo">🦷 AniOdonto<span>Prime</span></a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="produto.html">Tratamentos</a></li>
        <li><a href="new.html" class="ativo">Cadastro</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-box">
      <h2>Cadastro de Novo Usuário</h2>

      <form action="login.html" method="get">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Informe seu nome completo" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Informe seu e-mail" required>
        </div>

        <div class="campo">
          <label for="telefone">Telefone / WhatsApp</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(61) 99999-9999" required>
        </div>

        <div class="campo">
          <label for="senha">Senha de acesso</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
        </div>

        <div class="campo">
          <label for="unidade">Unidade de preferência</label>
          <select id="unidade" name="unidade" required>
            <option value="" disabled selected>Selecione a unidade</option>
            <option value="taguatinga">Unidade Taguatinga Centro</option>
            <option value="aguas-claras">Unidade Águas Claras</option>
            <option value="asa-sul">Unidade Asa Sul</option>
            <option value="ceilandia">Unidade Ceilândia</option>
          </select>
        </div>

        <div class="campo">
          <label>Tipo de usuário:</label>
          <div class="opcoes-radio">
            <label><input type="radio" name="perfil" value="paciente" checked> Paciente</label>
            <label><input type="radio" name="perfil" value="dentista"> Dentista / Especialista</label>
            <label><input type="radio" name="perfil" value="recepcao"> Recepção / Atendimento</label>
          </div>
        </div>

        <div class="form-acoes">
          <button type="submit" class="btn">Concluir Cadastro</button>
          <a href="login.html" class="btn btn-secundario">Já tenho conta (Fazer Login)</a>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 AniOdontoPrime Clínica Odontológica - Todos os direitos reservados.</p>
  </footer>

</body>
</html>
